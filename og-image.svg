<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FFC107"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#1e1e3a"/>
      <stop offset="100%" stop-color="#12122a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1100" cy="80"  r="180" fill="rgba(255,255,255,0.06)"/>
  <circle cx="100"  cy="560" r="140" fill="rgba(255,255,255,0.06)"/>
  <circle cx="600"  cy="630" r="200" fill="rgba(0,0,0,0.08)"/>

  <!-- Card -->
  <rect x="60" y="60" width="1080" height="510" rx="24" fill="url(#card)" opacity="0.92"/>

  <!-- Left: Icon area -->
  <!-- Camera body -->
  <rect x="120" y="180" width="260" height="180" rx="20" fill="#FFC107"/>
  <!-- Viewfinder bump -->
  <rect x="210" y="148" width="80" height="50" rx="12" fill="#FFC107"/>
  <!-- Lens outer -->
  <circle cx="250" cy="270" r="68" fill="#1a1a2e"/>
  <!-- Lens inner -->
  <circle cx="250" cy="270" r="48" fill="#2d2d4e"/>
  <!-- Lens ring -->
  <circle cx="250" cy="270" r="38" fill="none" stroke="#FFC107" stroke-width="3" opacity="0.4"/>
  <!-- Lens shine -->
  <circle cx="232" cy="252" r="12" fill="rgba(255,255,255,0.15)"/>
  <!-- Flash -->
  <circle cx="136" cy="196" r="14" fill="#1a1a2e"/>

  <!-- GPS pin on camera -->
  <circle cx="340" cy="320" r="36" fill="#E53935"/>
  <circle cx="340" cy="312" r="18" fill="#1a1a2e"/>
  <polygon points="340,356 322,326 358,326" fill="#E53935"/>
  <circle cx="340" cy="312" r="7" fill="white"/>

  <!-- Divider -->
  <rect x="430" y="120" width="4" height="390" rx="2" fill="#FFC107" opacity="0.5"/>

  <!-- Right: Text content -->
  <!-- App name -->
  <text x="480" y="190" font-family="'Segoe UI', Arial, sans-serif" font-size="62" font-weight="800" fill="#FFC107" letter-spacing="-1">GPS Watermark</text>

  <!-- Tagline -->
  <text x="480" y="250" font-family="'Segoe UI', Arial, sans-serif" font-size="28" fill="rgba(255,255,255,0.75)">Tambahkan lokasi, waktu &amp; cuaca pada foto</text>

  <!-- Feature pills -->
  <!-- Pill 1 -->
  <rect x="480" y="290" width="168" height="44" rx="22" fill="rgba(255,193,7,0.15)" stroke="#FFC107" stroke-width="1.5"/>
  <text x="564" y="318" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="#FFC107" text-anchor="middle">📍 GPS &amp; Peta</text>

  <!-- Pill 2 -->
  <rect x="662" y="290" width="148" height="44" rx="22" fill="rgba(255,193,7,0.15)" stroke="#FFC107" stroke-width="1.5"/>
  <text x="736" y="318" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="#FFC107" text-anchor="middle">🕐 Waktu</text>

  <!-- Pill 3 -->
  <rect x="824" y="290" width="148" height="44" rx="22" fill="rgba(255,193,7,0.15)" stroke="#FFC107" stroke-width="1.5"/>
  <text x="898" y="318" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="#FFC107" text-anchor="middle">🌤️ Cuaca</text>

  <!-- Watermark preview mockup -->
  <rect x="480" y="358" width="640" height="110" rx="12" fill="rgba(0,0,0,0.75)"/>
  <!-- Map thumb mockup -->
  <rect x="496" y="372" width="82" height="82" rx="8" fill="#2d4a6e"/>
  <rect x="496" y="372" width="82" height="82" rx="8" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <!-- Map grid lines -->
  <line x1="496" y1="413" x2="578" y2="413" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <line x1="537" y1="372" x2="537" y2="454" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <!-- Pin on map -->
  <circle cx="537" cy="408" r="8" fill="#E53935"/>
  <circle cx="537" cy="405" r="4" fill="#1a1a2e"/>
  <polygon points="537,420 531,410 543,410" fill="#E53935"/>
  <!-- Yellow bar -->
  <rect x="588" y="372" width="4" height="82" rx="2" fill="#FFC107"/>
  <!-- Text lines mockup -->
  <text x="602" y="396" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="white">Jl. Cempaka, Srengat, Kab. Blitar, Jawa Timur</text>
  <text x="602" y="418" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.75)">Lat: -8.0586°, Long: 112.0638°</text>
  <text x="602" y="438" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.75)">13/05/2026  14:30:22</text>
  <text x="602" y="458" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.75)">☁️ 28.77°C  💨 1.63m/s  💧 87%</text>

  <!-- Bottom tagline -->
  <text x="600" y="590" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="rgba(255,255,255,0.5)" text-anchor="middle">Gratis · Tanpa Login · Data Tersimpan Lokal</text>
</svg>
